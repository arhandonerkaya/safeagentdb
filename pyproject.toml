[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safeagentdb"
version = "0.2.0"
description = "Shadow-Sandbox DB Layer -- let AI agents modify your database safely with tenant isolation, Pydantic validation, and atomic sync."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Arhan", email = "arhandonerkaya20@gmail.com" },
]
keywords = [
    "ai-safety",
    "database",
    "sandbox",
    "pydantic",
    "sqlalchemy",
    "multi-tenancy",
    "llm",
    "ai-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/sippinonstraightchlorine/safeagentdb"
Repository = "https://github.com/sippinonstraightchlorine/safeagentdb"
Issues = "https://github.com/sippinonstraightchlorine/safeagentdb/issues"

[project.optional-dependencies]
pg = ["psycopg2-binary>=2.9"]
mysql = ["pymysql>=1.1"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["safeagentdb"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Script-style files that deliberately import partway through, to show the
# public import surface at the point it is exercised.
"examples/hello_world.py" = ["E402"]
"tests/test_core.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
