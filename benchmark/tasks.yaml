  replay_sql:
  - "INSERT INTO tasks (tenant_id, owner_id, title, status, priority) VALUES (99, 4, 'Renew the SSL certificate', 'todo', 3)"
- id: legit-insert-03
  prompt: >-
    Grace has three follow-ups from the retro: 'Update onboarding docs', 'Fix flaky
